name: Build Android APK

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: '上传到 GitHub Release 草稿'
        required: false
        default: false
        type: boolean
      release_tag:
        description: 'Release 标签，例如 v0.1.0'
        required: false
        default: ''
        type: string
      prerelease:
        description: '标记为预发布版本'
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install NDK
        run: |
          sdkmanager "ndk;29.0.14206865"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV
          echo "ANDROID_NDK=$ANDROID_HOME/ndk/29.0.14206865" >> $GITHUB_ENV

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build

      - name: Cache native deps
        uses: actions/cache@v6
        with:
          path: |
            app/src/main/jni/onnxruntime
            app/src/main/jniLibs/**/libonnxruntime.so
          key: native-${{ runner.os }}-${{ hashFiles('app/build-logic/tasks-native.gradle.kts') }}
          restore-keys: |
            native-${{ runner.os }}-

      - name: Download native deps (ONNX Runtime)
        run: ./gradlew downloadOnnx --no-daemon

      - name: Cache CMake build
        uses: actions/cache@v6
        with:
          path: |
            app/.cxx
            app/src/main/jni/boost
            app/src/main/jni/boost-*.tar.xz
          key: cmake-${{ runner.os }}-${{ hashFiles('app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            cmake-${{ runner.os }}-

      - name: Setup signing keystore
        run: |
          cat > app/keystore.properties <<'EOF'
          keyBase64=${{ secrets.SIGNING_KEY }}
          storePassword=${{ secrets.KEY_STORE_PASSWORD }}
          keyAlias=${{ secrets.ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Required rendered layout gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Keep layout gate reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: release-layout-gate
          path: app/build/outputs/androidTest-results/connected/

      - name: Build Release APKs (Signed)
        # A failed geometry test aborts this job before any release asset is built/uploaded.
        if: success()
        run: |
          ./gradlew assembleRelease --no-daemon
          mkdir -p app/build/outputs/apk/distribution
          cp app/build/outputs/apk/release/JO-IME-*.apk app/build/outputs/apk/distribution/

      - name: Required offline edition gate
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 29
          arch: x86_64
          profile: pixel_3a
          script: ./gradlew :app:connectedDebugAndroidTest -PbundleModels=true -PpythonExecutable=python3 -Pandroid.testInstrumentationRunnerArguments.class=com.kingzcheung.xime.ui.LayoutGeometryGateTest,com.kingzcheung.xime.ui.PanelLayoutAuditTest,com.kingzcheung.xime.ui.ExpandedCandidateLayoutTest,com.kingzcheung.xime.ui.OfflineEditionTest,com.kingzcheung.xime.ui.VisualStyleIntegrationTest,com.kingzcheung.xime.ui.IconAppearanceTest --no-daemon

      - name: Build offline Release APKs
        run: |
          ./gradlew assembleRelease -PbundleModels=true -PpythonExecutable=python3 --no-daemon
          cp app/build/outputs/apk/release/JO-IME-*-full-*.apk app/build/outputs/apk/distribution/

      - name: Build Plugin XIPKs (Unsigned)
        run: bash scripts/build-plugins.sh

      - name: Verify APK signatures
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          for apk in app/build/outputs/apk/distribution/JO-IME-*.apk; do
            OUT=$("$APKSIGNER" verify --verbose --min-sdk-version 23 --print-certs "$apk")
            # vivo OriginOS rejects APKs without a v1 (JAR) signature as 「安装包缺乏开发者证书」.
            # --min-sdk-version 23: for minSdk >= 24 apksigner skips v1 and always reports it false.
            echo "$OUT" | grep -q 'Verified using v1 scheme (JAR signing): true'
            echo "$OUT" | grep -q 'Verified using v2 scheme (APK Signature Scheme v2): true'
            echo "Verified: $apk"
          done

      - name: Resolve version
        id: get_version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || '' }}
        run: |
          set -euo pipefail
          version_name=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts | head -1)
          tag="${GITHUB_REF_NAME:-}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            test "$tag" = "v$version_name" || {
              echo "Tag $tag does not match versionName $version_name." >&2
              exit 1
            }
          elif [ -n "${RELEASE_TAG}" ]; then
            test "$RELEASE_TAG" = "v$version_name" || {
              echo "Release tag must be v$version_name." >&2
              exit 1
            }
            tag="$RELEASE_TAG"
          fi
          echo "VERSION=$version_name" >> "$GITHUB_OUTPUT"
          echo "TAG=$tag" >> "$GITHUB_OUTPUT"

      - name: Find APKs and plugin XIPKs
        id: find_apks
        run: |
          MAIN_APKS=$(find app/build/outputs/apk/distribution -name "JO-IME-*.apk" -type f | sort | tr '\n' ',' | sed 's/,$//')
          PLUGIN_XIPKS=$(find build/plugin-release -name "*.xipk" -type f | sort | tr '\n' ',' | sed 's/,$//')

          echo "main_apks=$MAIN_APKS" >> $GITHUB_OUTPUT
          echo "plugin_xipks=$PLUGIN_XIPKS" >> $GITHUB_OUTPUT

          if [ -z "$MAIN_APKS" ]; then
            echo "::warning::No main app APKs found!"
          fi
          if [ -z "$PLUGIN_XIPKS" ]; then
            echo "::warning::No plugin XIPKs found!"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: JO-IME-APKs
          path: |
            app/build/outputs/apk/distribution/JO-IME-*.apk
            build/plugin-release/*.xipk
          if-no-files-found: error

      - name: Upload assets to draft GitHub Release
        if: ${{ github.ref_type == 'tag' || (github.event_name == 'workflow_dispatch' && inputs.publish_release && inputs.release_tag != '') }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: JO-IME ${{ steps.get_version.outputs.TAG }}
          body_path: .github/release-notes/${{ steps.get_version.outputs.TAG }}.md
          draft: true
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          files: |
            ${{ steps.find_apks.outputs.main_apks }}
            ${{ steps.find_apks.outputs.plugin_xipks }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
